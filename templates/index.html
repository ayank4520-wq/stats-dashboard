<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stats Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE3D3; --paper-dark:#DED5C0; --ink:#1F2A22;
    --moss:#5B7553; --rust:#A6472A; --mustard:#C9A227;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Source Serif 4', serif; padding:32px 18px 64px;
  }
  .wrap{max-width:600px;margin:0 auto;}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--moss);margin:0 0 4px;}
  h1{font-size:26px;margin:0 0 18px;font-weight:600;}

  textarea{
    width:100%; min-height:80px; padding:12px;
    font-family:'IBM Plex Mono',monospace; font-size:14px;
    border:1px solid var(--ink); background:#F4EFE3; color:var(--ink);
    resize:vertical;
  }
  .hint{font-size:12.5px;color:#5a6155;margin:6px 0 16px;font-family:'IBM Plex Mono',monospace;}

  button{
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    background:var(--ink); color:var(--paper);
    border:none; padding:10px 18px; cursor:pointer;
  }
  button:hover{background:var(--moss);}

  #error{color:var(--rust); font-family:'IBM Plex Mono',monospace; font-size:13px; margin-top:12px;}

  .results{margin-top:26px;display:none;}
  .stat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;
  }
  .stat-box{
    background:#F4EFE3; border:1px solid #c9bfa6; padding:10px 12px;
  }
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--moss);}
  .stat-value{font-size:19px;font-weight:600;}

  .chart{display:flex; align-items:flex-end; gap:5px; height:140px; border-bottom:2px solid var(--ink); padding-bottom:0;}
  .bar{flex:1; background:var(--moss); position:relative; min-width:4px;}
  .bar.mean-line::after{
    content:''; position:absolute; left:-3px; right:-3px; top:var(--mean-pos,0);
    border-top:2px dashed var(--rust);
  }
  .chart-caption{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5a6155;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">personal stats dashboard</p>
  <h1>What do your numbers actually say?</h1>

  <textarea id="input" placeholder="e.g. 7500, 8200, 6100, 9800, 7200, 8000, 15200, 6900, 7100, 8300"></textarea>
  <p class="hint">comma-separated numbers &mdash; steps, hours of sleep, spending, whatever you're tracking</p>
  <button onclick="analyze()">Analyze</button>
  <div id="error"></div>

  <div class="results" id="results">
    <div class="stat-grid" id="statGrid"></div>
    <div class="chart" id="chart"></div>
    <p class="chart-caption">bars = your values &middot; dashed line = mean</p>
  </div>
</div>

<script>
async function analyze() {
  const raw = document.getElementById('input').value;
  const errorBox = document.getElementById('error');
  const resultsBox = document.getElementById('results');
  errorBox.textContent = '';

  // Parse "1, 2, 3" into [1, 2, 3], dropping anything that isn't a number
  const numbers = raw.split(',')
    .map(s => parseFloat(s.trim()))
    .filter(n => !isNaN(n));

  if (numbers.length < 2) {
    errorBox.textContent = 'Enter at least 2 valid numbers, separated by commas.';
    resultsBox.style.display = 'none';
    return;
  }

  try {
    const response = await fetch('/api/stats', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({numbers: numbers})
    });
    const data = await response.json();

    if (!response.ok) {
      errorBox.textContent = data.error || 'Something went wrong.';
      resultsBox.style.display = 'none';
      return;
    }

    renderResults(data);
  } catch (err) {
    errorBox.textContent = 'Could not reach the server. Is app.py running?';
  }
}

function renderResults(data) {
  const grid = document.getElementById('statGrid');
  grid.innerHTML = '';
  const stats = [
    ['Mean', data.mean], ['Median', data.median],
    ['Mode', Array.isArray(data.mode) ? data.mode.join(', ') : (data.mode ?? 'none')],
    ['Std Dev', data.std_dev], ['Range', data.range],
    ['Min / Max', data.min + ' / ' + data.max]
    ['CV', data.cv + '%']
  ];
  stats.forEach(([label, value]) => {
    grid.innerHTML += `<div class="stat-box"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
  });

  const chart = document.getElementById('chart');
  chart.innerHTML = '';
  const maxVal = Math.max(...data.numbers);
  const meanPct = (data.mean / maxVal) * 100;
  data.numbers.forEach(n => {
    const heightPct = (n / maxVal) * 100;
    chart.innerHTML += `<div class="bar mean-line" style="height:${heightPct}%; --mean-pos:${100 - meanPct}%"></div>`;
  });

  document.getElementById('results').style.display = 'block';
}
</script>
</body>
</html>
